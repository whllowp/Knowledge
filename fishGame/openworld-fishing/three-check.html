<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>three trim check</title>
    <style>
      body { margin: 0; background: #101820; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="status">loading…</div>
    <script type="module">
      const modPath = new URLSearchParams(location.search).get('m') || '/.build/three.trimmed.js';
      const THREE = await import(modPath);

      const status = (t) => {
        document.getElementById('status').textContent = t;
      };

      try {
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(640, 480);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.autoUpdate = false;
        renderer.shadowMap.needsUpdate = true;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x223344);
        if (location.search.includes('fog')) scene.fog = new THREE.Fog(0x223344, 8, 40);

        const camera = new THREE.PerspectiveCamera(60, 640 / 480, 0.1, 100);
        camera.position.set(3, 3, 6);
        camera.lookAt(0, 0.5, 0);

        const sun = new THREE.DirectionalLight(0xffffff, 2.2);
        sun.position.set(4, 8, 5);
        sun.castShadow = true;
        scene.add(sun, new THREE.HemisphereLight(0x8899ff, 0x332211, 1.1));

        const cube = new THREE.Mesh(
          new THREE.BoxGeometry(1.4, 1.4, 1.4),
          new THREE.MeshLambertMaterial({ color: 0xff8844 })
        );
        cube.position.y = 1;
        cube.castShadow = true;
        scene.add(cube);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(20, 20),
          new THREE.MeshLambertMaterial({ color: 0x3f7f4f })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const glow = new THREE.Mesh(
          new THREE.SphereGeometry(0.5, 16, 12),
          new THREE.MeshBasicMaterial({ color: 0x66ddff })
        );
        glow.position.set(-2, 0.8, 0);
        scene.add(glow);

        renderer.render(scene, camera);
        window.__R = renderer;
        window.__SCENE = { renderer, scene, camera };
        window.__px = (x = 320, y = 240) => {
          renderer.render(scene, camera);
          const gl = renderer.getContext();
          const buf = new Uint8Array(4);
          gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
          return [...buf];
        };
        window.__CHECK = { ok: true, calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
        status.textContent = `ok: ${renderer.info.render.calls} calls / ${renderer.info.render.triangles} tris`;
      } catch (err) {
        window.__CHECK = { ok: false, error: String(err && err.message ? err.message : err) };
        status.textContent = 'FAILED: ' + err;
      }
    </script>
  </body>
</html>
